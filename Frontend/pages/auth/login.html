<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Rawyverse</title>
    <!-- css file -->
    <link rel="stylesheet" href="/css/variable.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/auth/auth.css">
    <link rel="stylesheet" href="/css/loading.css">
    <!-- icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon" />
    <link rel="shortcut icon" href="/assets/icons/logo.ico" type="image/x-icon">

</head>
<body>
    <section class="container">
        <!-- hero -->
        <div class="hero">
            <div class="logo">
                <img src="/assets/images/book_logo.svg" alt="Rawyverse Book Logo">
                <h1>Rawyverse</h1>
            </div>
            <!-- content -->
            <article class="hero-content">
                <h2>سردٌ آسر وحكايات لا تُنسى.</h2>

                <p>سردٌ آسر وحكايات لا تُنسى..</p>
            </article>
        </div>
        <!-- register form -->
         <section class="register-form">
           <div class="card">
             <!-- header -->
            <div class="register-header">
                <h2>مرحباً بعودتك</h2>
                <p>افتقدناك في Rawyverse. يُرجى إدخال بياناتك لمواصلة رحلتك.</p>
            </div>
            <!-- Form -->
            <form action="">
                
                <section class="form-input">
                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="مثال: name@example.com" required>
                        <span class="material-symbols-outlined icons">email</span>

                    </div>
                    <p id="email-error">يُرجى إدخال بريد إلكتروني صالح.</p>
                    
                </div>

                <div class="input-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="8 أحرف على الأقل" required>
                        <span id="password-icon" class="material-symbols-outlined icons">visibility</span>                    

                    </div>
                    <p id="password-error">يجب ألا تقل كلمة المرور عن 8 أحرف.</p>
                </div>
                <!-- btn -->
                <div class="input-group"> <input type="submit" value="تسجيل الدخول"> </div>
                  <!-- divider -->

                    <span class="divider">أو المتابعة بواسطة</span>

                <!-- social media buttons -->
                 <div id="google-btn" class="google-btn ">
                    <img src="/assets/images/google_logo.svg" alt="Google Logo">
                    <input type="button" value="المتابعة باستخدام جوجل">
                 </div>
                <p class="have-account">ليس لديك حساب بعد؟ <a href="/pages/auth/register.html">إنشاء حساب</a></p>
                 </section>
            </form>
           </div>
         </section>
    </section>
    <!-- js -->
    
    <script type="module" src="/js/main.js"></script>
</body>
</html>
