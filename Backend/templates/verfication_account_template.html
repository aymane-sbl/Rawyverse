<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الحساب | Rawyverse</title>
    <style>
        /* ألوان Rawyverse الأصلية (Dark Mode) */
        :root {
            --bg-main: #0B0E14;
            --bg-surface: #151921;
            --text-main: #ffffff;
            --text-secondary: #94A3B8;
            --accent-color: #FF4B4B;
            --accent-hover: #e03e3e;
        }

        body {
            background-color: var(--bg-main);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        .verification-card {
            background-color: var(--bg-surface);
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            /* خط أحمر علوي لربط التصميم بالإيميل */
            border-top: 3px solid var(--accent-color);
        }

        /* تنسيق اللوجو النصي */
        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .logo span {
            color: var(--accent-color);
            font-weight: 300;
        }

        .icon-container {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 35px;
        }

        /* حالة النجاح - أخضر متناسق مع الدارك مود */
        .success .icon-container {
            background-color: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border: 1px solid #22c55e;
        }

        /* حالة الفشل - استخدام الأحمر الخاص بمشروعك */
        .error .icon-container {
            background-color: rgba(255, 75, 75, 0.1);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        p {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
            width: 80%;
            box-sizing: border-box;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="verification-card {% if is_success %}success{% else %}error{% endif %}">

        <div class="logo">Rawy<span>verse</span></div>

        {% if is_success %}
            <div class="icon-container">✓</div>
            <h1>تم تفعيل حسابك بنجاح!</h1>
            <p>{{ message }}</p>
            <a
href="https://{{domain}}/pages/auth/login.html" class="btn">تسجيل الدخول الآن</a>

        {% else %}
            <div class="icon-container">✗</div>
            <h1>عذراً، فشل التفعيل</h1>
            <p>{{ message }}</p>
            <a href="https://{{domain}}/pages/auth/register.html" class="btn">حاول التسجيل مجدداً</a>
        {% endif %}

    </div>

</body>
</html>
